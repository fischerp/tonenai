<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TonenAI</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="guitar-manager.css">
<link rel="stylesheet" href="livesets.css">
<link rel="stylesheet" href="gear.css">
<style>
  :root {
    --bg: #0b0b0f; --panel: #16161d; --text: #f4f4f6; --muted: #9a9aa8; --accent: #e11d2e;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
  body { overflow-y: auto; overflow-x: hidden; }
  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 20px;
    padding: 14px 4vw; background: linear-gradient(#0b0b0fee, #0b0b0f99 70%, transparent); backdrop-filter: blur(6px); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.3px; color: var(--text); font-size: 24px; }
  .nav { display: inline-flex; align-items: center; gap: 8px; } .ico { font-size: 17px; padding-left: 13px; padding-right: 13px; }
  .menubox { position: relative; }
  .menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 250px; white-space: nowrap; background: #1c1c26; border: 1px solid #33334a; border-radius: 10px;
    padding: 6px; box-shadow: 0 12px 32px #000b; z-index: 60; display: grid; gap: 2px; }
  .menu[hidden] { display: none; }
  .mi { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; color: var(--text); font: inherit; font-size: 14px; padding: 10px 12px; border-radius: 6px; cursor: pointer; }
  .mi:hover, .mi:focus { background: #ffffff1a; outline: none; } .mi.on { font-weight: 700; }
  .mic { width: 20px; text-align: center; } .mt { display: grid; } .mt small { color: var(--muted); font-size: 12px; font-weight: 400; }
  .mrow { display: flex; align-items: center; gap: 12px; padding: 8px 12px; font-size: 14px; } .mrow select { margin-left: auto; background: #14141b; border: 1px solid #2a2a37; color: var(--text); border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 13px; }
  .mchk { margin-left: auto; color: #3ddc84; } .msep { height: 1px; background: #33334a; margin: 6px 4px; }
  .mhead { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 6px 12px 4px; }
  .fl { font-size: 18px; line-height: 1; } .logo { cursor: pointer; }
  @media (max-width: 880px) { .nav .lbl { display: none; } .nav { padding-left: 13px; padding-right: 13px; } }
  @media (max-width: 640px) { .logo span { display: none; } header { gap: 12px; } }
  .logo img { height: 30px; width: auto; display: block; }
  .logo b { color: var(--accent); font-weight: 800; }
  .search { flex: 1; max-width: 720px; min-width: 120px; }
  .search input { width: 100%; padding: 8px 14px; border-radius: 20px; border: 1px solid #2c2c38;
    background: #14141b; color: var(--text); font-size: 14px; outline: none; }
  .search input:focus { border-color: #55556a; }
  header button.p { padding: 7px 14px; font-size: 13px; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; }
  .dot.on { background: #3ddc84; box-shadow: 0 0 8px #3ddc84; } .dot.off { background: #d9534f; }

  .car { position: relative; margin: 0 4vw 24px; border-radius: 14px; overflow: hidden; height: clamp(270px, 40vh, 380px); background: #14141c; }
  .slide { position: absolute; inset: 0; padding: 0 5vw 52px; display: flex; flex-direction: column; justify-content: flex-end; opacity: 0; transition: opacity .7s ease; pointer-events: none; background-size: cover; background-position: center; }
  .slide.on { opacity: 1; pointer-events: auto; } .slide::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #0b0b0fee 12%, #0b0b0f77 58%, #0b0b0f11), linear-gradient(0deg, #0b0b0fcc, transparent 55%); }
  .slide > * { position: relative; z-index: 1; } .slide .eyebrow { color: #ffffffb8; text-transform: uppercase; letter-spacing: 2px; font-size: 12px; font-weight: 700; } .slide.live .eyebrow { color: #7dffb0; }
  .slide h1 { margin: 6px 0 2px; font-size: clamp(28px, 4.6vw, 52px); line-height: 1.05; cursor: pointer; outline-offset: 4px; } .slide h1:hover { text-decoration: underline; text-decoration-thickness: 2px; }
  .slide .by { color: #ffffffd0; font-size: 18px; margin-bottom: 16px; } .slide .btns { display: flex; flex-wrap: wrap; gap: 10px; }
  .car-arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #000a; color: #fff; font-size: 28px; line-height: 1; cursor: pointer; opacity: 0; transition: opacity .15s, background .15s; }
  .car:hover .car-arrow, .car-arrow:focus-visible { opacity: 1; } .car-arrow:hover { background: #000e; } .car-arrow.prev { left: 12px; } .car-arrow.next { right: 12px; }
  .car-dots { position: absolute; left: 0; right: 0; bottom: 16px; z-index: 3; display: flex; justify-content: center; gap: 8px; }
  .car-dot { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 0; background: #ffffff55; cursor: pointer; transition: width .2s, background .2s; } .car-dot.on { width: 26px; border-radius: 5px; background: #fff; }
  .hero { position: relative; margin: 0 4vw 24px; border-radius: 14px; padding: 7vh 4vw; min-height: 34vh;
    display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #0b0b0fee 15%, #0b0b0f66 60%, transparent), linear-gradient(0deg, #0b0b0f, transparent 55%); }
  .hero > * { position: relative; z-index: 1; }
  .hero .eyebrow { color: #ffffffb0; text-transform: uppercase; letter-spacing: 2px; font-size: 12px; }
  .hero h1 { margin: 6px 0 4px; font-size: clamp(30px, 5vw, 56px); line-height: 1.05; }
  .hero .by { color: #ffffffc8; font-size: 18px; margin-bottom: 18px; }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; }
  button.p { border: 0; border-radius: 6px; padding: 10px 20px; font-size: 15px; font-weight: 600; cursor: pointer;
    background: #ffffff22; color: var(--text); transition: background .15s, transform .1s; }
  button.p:hover { background: #ffffff40; } button.p:active { transform: scale(.97); }
  button.p.main { background: var(--text); color: #000; } button.p.main:hover { background: #fff; }
  button.p.live { outline: 2px solid var(--accent); }

  section.row { margin: 0 0 26px; }
  section.row h2 { margin: 0 4vw 10px; font-size: 18px; font-weight: 700; }
  .track { display: flex; gap: 14px; overflow-x: auto; padding: 8px 4vw 18px; scroll-snap-type: x proximity; }
  .track::-webkit-scrollbar { height: 0; }
  .card { flex: 0 0 210px; height: 290px; border-radius: var(--radius); position: relative; cursor: pointer; overflow: hidden;
    scroll-snap-align: start; transition: transform .2s, box-shadow .2s; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; }
  .card:hover { transform: scale(1.06); box-shadow: 0 12px 30px #000a; z-index: 2; }
  .card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, #000e, #0004 45%, transparent 70%); }
  .card > * { position: relative; z-index: 1; }
  .card .t { font-weight: 800; font-size: 21px; line-height: 1.1; text-shadow: 0 2px 8px #0008; }
  .card .a { color: #ffffffd0; font-size: 13px; margin-top: 4px; }
  a.artist { color: inherit; cursor: pointer; text-decoration: none; border-bottom: 1px dotted transparent; } a.artist:hover, a.artist:focus { border-bottom-color: currentColor; outline: none; }
  .fav { position: absolute; top: 10px; right: 10px; z-index: 3; width: 32px; height: 32px; border-radius: 50%; border: 0; background: #000a; color: #fff; font-size: 17px; cursor: pointer; line-height: 1; opacity: 0; transition: opacity .12s, transform .12s; }
  .card:hover .fav, .fav.on { opacity: 1; } .fav:hover { transform: scale(1.12); background: #000d; } .fav.on, .sg-x button.favon { color: #ff4d6d; }
  .card .badge { position: absolute; top: 12px; left: 12px; z-index: 1; font-size: 11px; font-weight: 700; letter-spacing: 1px;
    padding: 3px 8px; border-radius: 4px; background: #000a; }
  .card .sbadge { position: absolute; top: 40px; left: 12px; z-index: 1; font-size: 10px; font-weight: 800; letter-spacing: 1px; padding: 3px 7px; border-radius: 4px; background: #f5a623; color: #000; }
  .card .sbadge.played { background: #3ddc84; }
  .prac { padding: 0 30px 16px; display: grid; gap: 10px; }
  .seg2 { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg2 button { border: 0; border-radius: 16px; padding: 7px 14px; font: inherit; font-size: 13px; font-weight: 600; background: #ffffff14; color: var(--text); cursor: pointer; }
  .seg2 button:hover { background: #ffffff26; } .seg2 button[aria-checked="true"] { background: var(--text); color: #000; }
  .seg2 button[aria-checked="true"][data-status="learning"] { background: #f5a623; } .seg2 button[aria-checked="true"][data-status="played"] { background: #3ddc84; }
  #pnotes { width: 100%; box-sizing: border-box; background: #14141b; border: 1px solid #2c2c38; border-radius: 8px; color: var(--text); font: inherit; font-size: 14px; padding: 10px 12px; resize: vertical; min-height: 64px; }
  #pnotes:focus { outline: none; border-color: #55556a; } .psaved { color: var(--muted); font-size: 12px; min-height: 15px; margin-top: -4px; }
  .card.live .badge { background: var(--accent); }

  .results { margin: 4px 4vw 40px; max-width: 760px; }
  .results h2 { font-size: 18px; margin: 4px 0 12px; } .results .hint { color: var(--muted); font-size: 13px; margin-left: 8px; font-weight: 400; }
  .res { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 10px; background: #14141b; margin-bottom: 8px; }
  .res:hover { background: #1c1c26; }
  .res .art { width: 56px; height: 56px; border-radius: 6px; background: #2a2a37 center/cover; flex: none; }
  .res .m { min-width: 0; flex: 1; } .res .n { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .d { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: .5px; color: #3ddc84; margin-right: 6px; }
  .empty { margin: 8vh 4vw; max-width: 520px; }
  .empty h2 { margin: 0 0 6px; font-size: 24px; } .empty p { color: var(--muted); margin: 0 0 18px; }
  .stages { list-style: none; margin: 18px auto 0; padding: 0; display: grid; gap: 12px; width: fit-content; max-width: 100%; text-align: left; }
  .stages li { display: grid; grid-template-columns: 22px 1fr; column-gap: 10px; align-items: center; color: var(--muted); font-size: 15px; }
  .stages li.done, .stages li.now { color: var(--text); } .stages li.now > span:nth-child(2) { font-weight: 700; }
  .stages .si { text-align: center; } .stages li.done .si { color: #3ddc84; font-weight: 800; } .stages li.todo .si { opacity: .5; }
  .stages small { grid-column: 2; color: var(--muted); font-size: 13px; font-weight: 400; margin-top: 2px; }
  .elapsed { color: var(--muted); font-size: 13px; margin-top: 14px; font-variant-numeric: tabular-nums; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #ffffff55; border-top-color: #fff; border-radius: 50%;
    animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 8px; } @keyframes sp { to { transform: rotate(360deg); } }
  .sheet .foot { padding: 0 30px 26px; } .link { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0; text-decoration: underline; }
  .link:hover { color: var(--text); } .sheet .foot { display: flex; align-items: center; gap: 12px; } .foot .sp { flex: 1; }
  .link.danger { color: #ff8a85; } .confirm { color: var(--muted); font-size: 13px; } .confirm button { margin-left: 8px; padding: 5px 12px; font-size: 13px; }
  button.p.red { background: #c62828; color: #fff; } button.p.red:hover { background: #e53935; }
  .modal { position: fixed; inset: 0; background: #000c; display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal.open { display: flex; }
  .aiform { padding: 6px 30px 26px; display: grid; gap: 12px; }
  .aiopt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: #1f1f29; cursor: pointer; border: 2px solid transparent; }
  .aiopt.on { border-color: var(--accent); } .aiopt input { margin-top: 4px; accent-color: var(--accent); }
  .aiopt span { display: grid; gap: 3px; } .aiopt small, .aiform label small { color: var(--muted); font-size: 12px; font-weight: 400; letter-spacing: 0; }
  .aifields { display: grid; gap: 12px; padding: 4px 2px 0; }
  .aifields label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .5px; }
  .aifields input, .aifields select { background: #14141b; border: 1px solid #2a2a37; color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 14px; font-weight: 400; letter-spacing: 0; }
  .aicards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .aicard { text-align: left; background: #1f1f29; border: 2px solid transparent; border-radius: 10px; padding: 12px 14px; cursor: pointer; color: var(--text); font: inherit; display: grid; gap: 3px; align-content: start; }
  .aicard b { font-size: 15px; } .aicard small { color: var(--muted); font-size: 12px; line-height: 1.35; }
  .aicard:hover { background: #2a2a37; } .aicard.on { border-color: var(--accent); }
  .aibody { display: grid; gap: 12px; margin-top: 4px; }
  .aibody label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .5px; }
  .aibody label small { font-weight: 400; letter-spacing: 0; }
  .aibody input, .aibody select { background: #14141b; border: 1px solid #2a2a37; color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 14px; font-weight: 400; letter-spacing: 0; }
  .aikey { display: flex; gap: 8px; } .aikey input { flex: 1; min-width: 0; }
  .aistatus { font-size: 13px; color: var(--muted); min-height: 18px; display: flex; align-items: center; gap: 8px; } .aistatus.ok { color: #7dffb0; } .aistatus.err { color: #ff8a85; }
  .aihelp { background: #14141b; border-radius: 8px; padding: 12px 14px; font-size: 13px; display: grid; gap: 8px; justify-items: start; }
  .aihelp code { background: #0b0b0f; padding: 6px 10px; border-radius: 6px; user-select: all; font-size: 13px; }
  .aiadv { display: grid; gap: 12px; } .aiadv summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .aibtns { display: flex; align-items: center; gap: 10px; margin-top: 4px; } .aibtns #ai-msg { flex: 1; font-size: 13px; color: var(--muted); } .aibtns #ai-msg.err { color: #ff8a85; } .aibtns #ai-msg.ok { color: #7dffb0; }
  .sheet { width: min(620px, 92vw); max-height: 86vh; overflow: auto; background: var(--panel); border-radius: 14px; }
  .sheet .top { padding: 34px 30px 20px; position: relative; }
  .sheet .top::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--panel), transparent 80%); }
  .sheet .top > * { position: relative; z-index: 1; }
  .sheet h3 { margin: 0; font-size: 30px; } .sheet .by { color: #ffffffc0; }
  .plist { padding: 6px 30px 28px; display: grid; gap: 10px; }
  .pitem { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 8px; background: #1f1f29; cursor: pointer; }
  .pitem:hover { background: #2a2a37; } .pitem.live { outline: 2px solid var(--accent); }
  .pitem .n { font-weight: 700; } .pitem .d { color: var(--muted); font-size: 13px; }
  .pitem .go { margin-left: auto; font-weight: 700; white-space: nowrap; }
  .bpm { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .bpm .big { font-size: 46px; font-weight: 800; line-height: 1; } .bpm .big small { font-size: 14px; color: var(--muted); font-weight: 600; margin-left: 6px; }
  .bpm button { margin-left: auto; white-space: nowrap; }
  .dials { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin: 4px 0 14px; }
  .dial text { fill: #9a9aa8; font-size: 8.5px; text-anchor: middle; } .dial .on text { fill: #fff; font-weight: 700; }
  .stylerow { display: flex; gap: 4px; margin-top: 6px; } .sty { width: 26px; height: 26px; border-radius: 6px; background: #2a2a37; color: #9a9aa8; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .sty.ok { background: #1f4d36; color: #7dffb0; } .sty.three { border: 1px dashed #6d6d80; }
  .steps { margin: 10px 0 8px; padding-left: 20px; } .steps li { margin: 6px 0; } .steps b { color: #fff; }
  .gtr { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; background: #14141b; margin-bottom: 6px; }
  .gtr.best { outline: 2px solid #3ddc84; } .gtr .m { flex: 1; min-width: 0; } .gtr .n { font-weight: 700; } .gtr .d { color: var(--muted); font-size: 13px; }
  .stars { color: #ffd75e; letter-spacing: 2px; white-space: nowrap; } .stars i { color: #444455; font-style: normal; }
  .best-tag { font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #0b0b0f; background: #3ddc84; padding: 2px 7px; border-radius: 4px; margin-left: 8px; }
  .glist { padding: 6px 30px 14px; } .gempty { color: var(--muted); padding: 6px 0 12px; } .xbtn { background: none; border: 0; color: #ff8a85; cursor: pointer; font-size: 13px; }
  .badge2 { font-size: 11px; font-weight: 800; letter-spacing: 1px; padding: 3px 9px; border-radius: 5px; margin-left: 8px; vertical-align: 1px; }
  .badge2.yes { background: #1f4d36; color: #7dffb0; } .badge2.optional { background: #5a4a1a; color: #ffd75e; } .badge2.no { background: #2a2a37; color: #9a9aa8; }
  .wh { display: flex; gap: 22px; flex-wrap: wrap; margin: 6px 0 12px; } .wh .col { min-width: 120px; }
  .wh .lbl { font-size: 11px; color: var(--muted); letter-spacing: 1px; font-weight: 700; margin-bottom: 5px; }
  .pill { display: block; padding: 3px 10px; margin-bottom: 3px; border-radius: 12px; background: #2a2a37; color: #9a9aa8; font-size: 12px; font-weight: 700; }
  .pill.on { background: #c62828; color: #fff; box-shadow: 0 0 10px #c6282888; }
  .nums { display: flex; gap: 3px; margin-bottom: 8px; flex-wrap: wrap; max-width: 250px; } .nums .pill { display: inline-block; margin: 0; padding: 4px 8px; min-width: 26px; text-align: center; }
  /* song window: facts first, details on demand */
  .sheet.wide { width: min(780px, 94vw); }
  .sg-top { position: relative; padding: 26px 30px 16px; } .sg-top::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--panel) 4%, #16161d88 55%, #16161d22); }
  .sg-top > * { position: relative; z-index: 1; } .sg-top h3 { font-size: 32px; line-height: 1.05; margin: 0; } .sg-top .by { font-size: 16px; margin-top: 2px; }
  .sg-x { position: absolute; top: 14px; right: 16px; z-index: 2; display: flex; gap: 8px; }
  .tabbtn { margin-top: 10px; padding: 7px 14px; font-size: 13.5px; background: #000a; } .tabbtn:hover { background: #000d; }
  .sg-x button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: #000a; color: #fff; font-size: 17px; cursor: pointer; line-height: 1; } .sg-x button:hover { background: #000d; }
  .facts { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: baseline; margin-top: 16px; }
  .fact .v { font-size: 26px; font-weight: 800; line-height: 1; } .fact .v small { font-size: 12px; color: var(--muted); font-weight: 700; margin-left: 4px; } .fact .l { font-size: 11px; letter-spacing: 1px; color: #ffffffa8; font-weight: 700; margin-top: 3px; }
  .sg-h { margin: 6px 30px 10px; font-size: 12px; letter-spacing: 1.2px; color: var(--muted); font-weight: 800; text-transform: uppercase; }
  .patches { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; padding: 0 30px 18px; }
  .patch { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; background: #22222f; cursor: pointer; border: 1.5px solid transparent; transition: background .12s, transform .1s; }
  .patch:hover { background: #2c2c3d; } .patch:active { transform: scale(.985); } .patch.live { border-color: var(--accent); background: #2a1c22; }
  .patch .pi { width: 38px; height: 38px; border-radius: 50%; background: #e11d2e; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none; }
  .patch.live .pi { background: #3ddc84; color: #04120a; } .patch .n { font-weight: 800; font-size: 15px; } .patch .d { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
  .patch .tag { margin-left: auto; font-size: 11px; font-weight: 800; letter-spacing: .8px; color: #3ddc84; white-space: nowrap; }
  .tiles3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; padding: 0 30px 14px; } @media (max-width: 640px) { .tiles3 { grid-template-columns: 1fr; } }
  .stile { text-align: left; border: 1.5px solid #2a2a3a; background: #1b1b25; border-radius: 12px; padding: 12px 14px; cursor: pointer; color: var(--text); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .stile:hover { border-color: #4a4a62; } .stile[aria-expanded="true"] { border-color: #7a7af0; background: #1d1d34; }

  .toast.err { background: #5a1f22; }

  #splash { position: fixed; inset: 0; z-index: 300; display: grid; place-items: center; cursor: pointer;

  #splash::before { content: ""; position: absolute; width: 70vmin; height: 70vmin; border-radius: 50%; background: radial-gradient(circle, #e11d2e55 0%, #e11d2e18 40%, transparent 70%);

// the amp and pedals you own (My gear); until the app answers, the two default pedals

function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function bg(s) { return s.cover ? `linear-gradient(0deg, #0006, #0002), url('${s.cover}') center/cover` : grad(s); }
function grad(s) {   // no cover yet: a colourful generated one, always the same for the same song
  const h = hue(s.artist || s.title), st = Math.floor(hue((s.id || "") + (s.title || "")) / 7) % 4;
  const base = `linear-gradient(155deg, hsl(${h} 72% 48%), hsl(${(h + 50) % 360} 75% 20%))`;
  const pat = [
    "repeating-radial-gradient(circle at 68% 30%, transparent 0 34px, #ffffff26 34px 40px)",
    "repeating-linear-gradient(115deg, #ffffff1c 0 22px, transparent 22px 56px)",
    "radial-gradient(circle at 50% 34%, #ffeccc70 0 27%, transparent 28%)",
    "repeating-linear-gradient(60deg, #ffffff16 0 30px, transparent 30px 60px), repeating-linear-gradient(-60deg, #ffffff10 0 30px, transparent 30px 60px)"][st];
  return `${pat}, ${base}`;
}

const TRIO_GENRES = ["Blues", "R&B", "Rock", "Alt Rock", "Metal", "Pop", "E-Pop", "Hip-Hop", "Country", "Folk", "Latin", "Jazz"];
function genreIndex(g) {
  const t = (g || "").toLowerCase();
  const map = [["alt", 3], ["electronic", 6], ["e-pop", 6], ["hip", 7], ["r&b", 1], ["metal", 4], ["blues", 0], ["rock", 2], ["pop", 5], ["country", 8], ["folk", 9], ["latin", 10], ["jazz", 11]];
  for (const [k, i] of map) if (t.includes(k)) return i;
  return -1;
}
function genreDial(sel) {   // 12 positions, same layout as the pedal's GENRE knob (Blues bottom-left, clockwise to Jazz bottom-right)
  const cx = 84, cy = 84, R = 62; let out = "";
  TRIO_GENRES.forEach((g, i) => {
    const a = (-150 + i * (300 / 11)) * Math.PI / 180, x = cx + R * Math.sin(a), y = cy - R * Math.cos(a), on = i === sel;
    out += `<g class="${on ? "on" : ""}"><circle cx="${x}" cy="${y}" r="${on ? 6 : 3.5}" fill="${on ? "#3ddc84" : "#555566"}"/>` +
      `<text x="${cx + (R + 21) * Math.sin(a)}" y="${cy - (R + 21) * Math.cos(a) + 3}">${esc(g)}</text></g>`;
  });
  const a = sel >= 0 ? (-150 + sel * (300 / 11)) * Math.PI / 180 : null;
  const hand = a === null ? "" : `<line x1="${cx}" y1="${cy}" x2="${cx + 30 * Math.sin(a)}" y2="${cy - 30 * Math.cos(a)}" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`;
  return `<svg class="dial" width="224" height="170" viewBox="-28 -2 224 170"><circle cx="${cx}" cy="${cy}" r="24" fill="#2a2a37"/>${hand}${out}</svg>`;
}
let CLICK = null;
function toggleClick(bpm) {
  if (CLICK) { clearInterval(CLICK.t); CLICK.c.close(); CLICK = null; return refreshClickBtn(); }
  const c = new (window.AudioContext || window.webkitAudioContext)(); let n = 0;
  const beep = () => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = n++ % 4 === 0 ? 1500 : 1000;
    g.gain.setValueAtTime(.4, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .06); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + .07); };
  beep(); CLICK = { c, t: setInterval(beep, 60000 / bpm) }; refreshClickBtn();
}
function refreshClickBtn() { document.querySelectorAll("[data-click]").forEach(b => { b.textContent = CLICK ? tx("■ Stop") : (b.classList.contains("mini") ? tx("▶ Click {0}", b.dataset.click) : tx("▶ Click track")); }); }

const MODELS = ["les paul", "stratocaster", "strat", "telecaster", "tele", "sg", "es-335", "335", "explorer", "flying v", "jazzmaster", "jaguar", "prs", "firebird", "rd", "v"];

function modelMatch(g, originals) {
  const mine = (g.kind + " " + g.name).toLowerCase();
  return (originals || []).some(o => { const t = (o.guitar || "").toLowerCase();
    return MODELS.some(m => (m.length > 3 ? mine.includes(m) && t.includes(m) : new RegExp("\\b" + m + "\\b").test(mine) && new RegExp("\\b" + m + "\\b").test(t))); });
}
function rate(g, gi) {   // -> {stars 0-3, score (for sorting), why, exact}
  const need = gi.pickups_needed || "any", pk = g.pickups;
  if (pk === "acoustic") return { stars: 0, score: 0, why: tx("Acoustic: it won't suit this electric patch.") };
  const exact = modelMatch(g, gi.originals);
  if (exact) {   // the same model as on the record always ranks first; the same brand edges out lookalikes
    const mine = (g.brand + " " + g.name).toLowerCase(), sameBrand = (gi.originals || []).some(o => g.brand && (o.guitar || "").toLowerCase().includes(g.brand.toLowerCase()));
    return { stars: 3, score: 4 + (sameBrand ? .3 : 0) + (pk === need ? .1 : 0), exact: true, why: tx("The same model as on the record.") };
  }
  if (need === "any") return { stars: pk === "hss" || pk === "hsh" ? 3 : 2, score: pk === "hss" || pk === "hsh" ? 2.6 : 2, why: tx("Pickup type isn't critical for this song.") };
  if (pk === need) return { stars: 3, score: 3, why: tx("{0} pickups, like the original.", PK[pk]) };
  if (pk === "hss" || pk === "hsh") return { stars: 3, score: 2.8, why: need === "humbucker" ? tx("Use a humbucker position (bridge).") : tx("Use the single-coil positions (middle/neck).") };
  if (pk === "p90" || need === "p90") return { stars: 2, score: 2, why: tx("P-90s sit between single-coil and humbucker; a close match.") };
  return need === "humbucker"
    ? { stars: 1, score: 1, why: tx("Thinner than the record: use the bridge pickup, raise the Katana gain a little and trim treble.") }
    : { stars: 1, score: 1, why: tx("Hotter and thicker than the record: use the neck pickup, roll volume to ~7, split the coils if you can.") };
}

// ---- hero carousel: what is on the amp now, then the songs you last sent to it
let CAR = { i: 0, sig: "", timer: null, paused: false };
function carouselSlides() {
  const out = [], seen = new Set(), add = (s, label, cls) => { if (s && !seen.has(s.id)) { seen.add(s.id); out.push({ s, label, cls }); } };
  if (LIVE) add(SONGS.find(x => x.id === LIVE.id), tx("Now playing on your Katana"), "live");
  const played = recents().map(id => SONGS.find(x => x.id === id)).filter(Boolean);
  played.slice(0, 6).forEach(x => add(x, tx("Last sent to your amp")));
  if (!played.length) SONGS.slice(0, 4).forEach(x => add(x, tx("Latest added")));   // fresh install: nothing played yet (SONGS is newest first)
  return out.slice(0, 8);
}
function renderCarousel() {
  const host = $("#hero"), slides = carouselSlides();
  if (!slides.length || q) { host.innerHTML = ""; CAR.sig = ""; clearInterval(CAR.timer); return; }
  const sig = slides.map(x => x.s.id + "|" + x.label + "|" + (x.s.cover ? 1 : 0) + "|" + (LIVE && LIVE.id === x.s.id ? LIVE.index : "")).join(";");
  if (sig !== CAR.sig) {
    CAR.sig = sig; if (CAR.i >= slides.length) CAR.i = 0;

const aiCurrent = () => AI.provider === "claude" ? "Claude" : ((AI_NAMES[(AI.openai || {}).preset] || tx("Other server")) + ((AI.openai || {}).model ? " · " + AI.openai.model : ""));
const aiLocal = id => id === "ollama" || id === "lmstudio";
const aiUsable = ms => { const u = ms.filter(m => !/embed|whisper|tts|dall|moderation|rerank|transcribe|realtime/i.test(m)); return u.length ? u : ms; };
const aiCanSave = () => !!AF && (AF.provider === "claude" || (/^https?:\/\/\S+$/.test(AF.base_url.trim()) && !!AF.model.trim()));
function aiSyncSave() { const b = $("#ai-save"); if (b) b.disabled = !aiCanSave(); }
async function aiOpen() {
  const a = api();
  try { if (a && a.get_ai) AI = await a.get_ai(); } catch (e) {}
  const o = AI.openai || {};
  AF = { provider: AI.provider, preset: o.preset || "ollama", base_url: o.base_url || "", model: o.model || "", api_key: "", search: o.search || "duckduckgo",
         has_key: !!o.has_key, models: [], status: {}, adv: false };
  aiRender(); $("#amodal").classList.add("open");
  if (AF.provider === "openai" && (aiLocal(AF.preset) || AF.has_key)) aiCheck();
}
function aiClose() { $("#amodal").classList.remove("open"); AF = null; }
function aiPick(id) {
  if (!AF) return;
  if (id === "claude") { AF.provider = "claude"; return aiRender(); }
  const p = (AI.presets || []).find(x => x.id === id); if (!p) return;
  AF.provider = "openai"; AF.preset = id; AF.models = []; AF.status = {}; AF.api_key = "";
  if (id !== "custom") { AF.base_url = p.base_url; AF.model = p.model || ""; }
  AF.has_key = !!(AI.openai || {}).has_key && AF.base_url === (AI.openai || {}).base_url;
  aiRender();
  if (aiLocal(id) || (p.key && AF.has_key)) aiCheck();
}
async function aiCheck() {   // ask the server what models it has, using the form values (nothing is saved yet)
  const a = api(); if (!a || !AF) return;
  const url = AF.base_url; AF.status = { kind: "busy", text: tx("Checking…") }; aiRender();
  const r = await a.test_ai({ base_url: AF.base_url, api_key: AF.api_key });
  if (!AF || AF.base_url !== url) return;                      // the user moved on while we were waiting
  if (!r.ok) { AF.models = []; AF.status = { kind: "err", text: r.error }; return aiRender(); }
  AF.models = r.models || []; const u = aiUsable(AF.models), prev = AF.model;
  if (!u.length) AF.status = { kind: "err", text: tx("Connected, but no models are installed yet.") };
  else {
    if (!u.includes(AF.model)) AF.model = u.length <= 12 ? u[0] : "";
    AF.status = prev && prev !== AF.model
      ? { kind: "err", text: AF.model ? tx("“{0}” is not on this server, so “{1}” is selected. Press Save to use it.", prev, AF.model) : tx("“{0}” is not on this server. Choose another model.", prev) }
      : { kind: "ok", text: tx("Found {0} models. Pick one:", u.length) };
  }
  aiRender();
}
function aiRender() {
  if (!AF) return;
  const f = AF, other = f.provider === "openai", pre = (AI.presets || []).find(x => x.id === f.preset) || {}, local = aiLocal(f.preset), st = f.status || {};
  const opt = (v, t, cur) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(t)}</option>`;
  const cards = [{ id: "claude", name: "Claude", sub: tx("Uses your Claude sign-in. See the README for the one-time login."), on: !other }]
    .concat((AI.presets || []).map(x => ({ id: x.id, name: AI_NAMES[x.id] || tx("Other server"), sub: tx(AI_SUBS[x.id] || AI_SUBS.custom), on: other && f.preset === x.id })));
  const usable = aiUsable(f.models || []);
  let body = "";
  if (other) {
    const urlRow = f.preset === "custom" ? `<label>${tx("Server URL")}<input id="ai-url" value="${esc(f.base_url)}" placeholder="https://…/v1" spellcheck="false" autocomplete="off"></label>` : "";
    const keyRow = local ? "" : `<label>${tx("API key")}<span class="aikey"><input id="ai-key" type="password" autocomplete="off" placeholder="${f.has_key ? "••••••••" : ""}"><button class="p" data-ai="test">${tx("Connect")}</button></span>
      <small>${AI_KEYURL[f.preset] ? tx("Get a key at {0}", AI_KEYURL[f.preset]) + ". " : ""}${tx("Saved on this computer only.")}</small></label>`;
    const stat = `<div class="aistatus ${st.kind || ""}">${st.kind === "busy" ? '<span class="spin"></span>' : ""}${esc(st.text || "")}</div>`;
    const sel = usable.length ? `<label>${tx("Model")}<select id="ai-model-sel">${usable.includes(f.model) ? "" : `<option value="">${tx("Choose a model…")}</option>`}${usable.map(m => opt(m, m, f.model)).join("")}</select></label>` : "";
    const help = local && st.kind === "err" ? `<div class="aihelp">${f.preset === "ollama" ? tx("Install Ollama from ollama.com, start it, then run this in Terminal:") + "<code>ollama pull qwen2.5:14b-instruct</code>" : tx("Open LM Studio, load a model and start its local server.")}<button class="p" data-ai="test">${tx("Check again")}</button></div>` : "";
    body = `<div class="aibody">${urlRow}${keyRow}${stat}${sel}${help}
      <details class="aiadv"${f.adv ? " open" : ""}><summary>${tx("Advanced")}</summary>
        ${f.preset === "custom" ? "" : `<label>${tx("Server URL")}<input id="ai-url" value="${esc(f.base_url)}" spellcheck="false" autocomplete="off"></label>`}
        <label>${tx("Model")}<input id="ai-model" value="${esc(f.model)}" spellcheck="false" autocomplete="off"></label>
        <label>${tx("Web research")}<select id="ai-search">${opt("duckduckgo", "DuckDuckGo", f.search)}${opt("none", tx("Off"), f.search)}</select></label>
        <p class="tip" style="margin:0">${tx("Smaller models guess more about gear and tuning. Treat their patches as a starting point.")}</p>
      </details></div>`;
  }
  $("#asheet").innerHTML = `<div class="top"><h3>${tx("AI provider")}</h3><div class="by">${tx("Choose which AI builds your patches")}</div></div>
  <div class="aiform"><div class="aicards">${cards.map(c => `<button class="aicard${c.on ? " on" : ""}" data-card="${esc(c.id)}"><b>${esc(c.name)}</b><small>${esc(c.sub)}</small></button>`).join("")}</div>
    ${body}
    ${AI.env ? `<p class="tip" style="margin:0">${tx("The TONENAI_PROVIDER environment variable overrides this setting.")}</p>` : ""}
    <div class="aibtns"><span id="ai-msg"></span><button class="p" data-ai="close">${tx("Close")}</button><button class="p main" id="ai-save" data-ai="save"${aiCanSave() ? "" : " disabled"}>${tx("Save")}</button></div>
  </div>`;
}
function aiMsg(text, cls) { const m = $("#ai-msg"); if (m) { m.textContent = text; m.className = cls || ""; } }
$("#asheet").addEventListener("input", e => {
  if (!AF) return; const v = e.target.value;
  if (e.target.id === "ai-url") AF.base_url = v; else if (e.target.id === "ai-model") AF.model = v; else if (e.target.id === "ai-key") AF.api_key = v;
  aiSyncSave();
});
$("#asheet").addEventListener("change", e => {
  if (!AF) return;
  if (e.target.id === "ai-model-sel") { AF.model = e.target.value; aiSyncSave(); }
  else if (e.target.id === "ai-search") AF.search = e.target.value;
});
$("#asheet").addEventListener("click", async e => {
  if (!AF) return;
  const sm = e.target.closest && e.target.closest("summary"); if (sm) { AF.adv = !sm.parentElement.open; return; }
  const c = e.target.closest("[data-card]"); if (c) return aiPick(c.dataset.card);
  const b = e.target.closest("[data-ai]"); if (!b) return; const a = api(); if (!a) return;
  if (b.dataset.ai === "close") return aiClose();
  if (b.dataset.ai === "test") return aiCheck();
  const r = await a.set_ai({ provider: AF.provider, preset: AF.preset, base_url: AF.base_url, model: AF.model, api_key: AF.api_key, search: AF.search });
  if (!r.ok) return aiMsg(r.error, "err");
  AI = r.ai; aiClose(); toast(tx("Settings saved")); applyStatic(); render();
});
$("#amodal").addEventListener("click", e => { if (e.target.id === "amodal") aiClose(); });
$("#abtn").addEventListener("click", aiOpen);

// ---- header menu: Livesets / My guitars / Import / AI live in one dropdown so the search box gets the room
const menuOpen = () => !$("#menu").hidden;
function menuToggle(open, focus) {
  $("#menu").hidden = !open; $("#mbtn").setAttribute("aria-expanded", String(open));
  if (open && focus !== false) { const f = $("#menu .mi"); if (f) f.focus(); }
}
$("#mbtn").addEventListener("click", () => menuToggle(!menuOpen()));
$("#mbtn").addEventListener("keydown", e => { if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); menuToggle(true); } });
$("#menu").addEventListener("click", e => { if (e.target.closest(".mi")) menuToggle(false, false); });   // the item's own handler still runs
$("#menu").addEventListener("keydown", e => {
  const items = [...$("#menu").querySelectorAll(".mi")], i = items.indexOf(document.activeElement);
  if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  else if (e.key === "Tab") menuToggle(false, false);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && menuOpen()) { menuToggle(false); $("#mbtn").focus(); } });
document.addEventListener("click", e => { if (menuOpen() && !e.target.closest(".menubox")) menuToggle(false, false); });

// ---- results per search (settings.json "search_limit"; default 10)
let SLIM = 10;
const SL_CHOICES = [5, 10, 15, 20, 30];
function renderSearchLimit() {
  $("#sllbl").textContent = tx("Results per search");
  $("#slsel").innerHTML = (SL_CHOICES.includes(SLIM) ? SL_CHOICES : [...SL_CHOICES, SLIM].sort((a, b) => a - b)).map(n => `<option value="${n}"${n === SLIM ? " selected" : ""}>${n}</option>`).join("");
}
$("#slsel").addEventListener("change", async e => {
  const a = api(), n = Number(e.target.value); if (!a || !a.set_search_limit) return;
  const r = await a.set_search_limit(n);
  if (!r.ok) { toast(r.error, true); return renderSearchLimit(); }
  SLIM = r.limit; toast(tx("Settings saved"));
  if (RES && RES.q && !RES.loading) { const term = RES.q; RES = { q: term, loading: true }; render(); const x = await a.search_songs(term); if (RES && RES.q === term) { RES = x.ok ? { q: term, items: x.items } : { q: term, error: x.error }; render(); } }
});
function applyStatic() {
  document.documentElement.lang = LANG;
  $("#q").placeholder = tx("Search songs or artists");
  $("#mbtn").setAttribute("aria-label", tx("Settings and more")); $("#mbtn").title = tx("Settings and more");
  const nav = (id, ic, key, tip) => { $(id).innerHTML = `<span class="ic" aria-hidden="true">${ic}</span><span class="lbl">${tx(key)}</span>`; $(id).title = tx(tip); $(id).setAttribute("aria-label", tx(key)); };
  nav("#lbtn", "📻", "Livesets", "Plan what goes into the amp's banks"); nav("#gbtn", "🎛", "My gear", "Your amp, pedals and guitars");
  $("#imp").innerHTML = `<span class="mic" aria-hidden="true">＋</span><span>${tx("Import .tsl")}</span>`; $("#imp").title = tx("Load a Tone Studio .tsl file");
  $("#abtn").innerHTML = `<span class="mic" aria-hidden="true">🤖</span><span class="mt">${tx("AI provider")}<small>${esc(aiCurrent())}</small></span>`; $("#abtn").title = tx("Choose which AI builds your patches");
  renderLang(); renderSearchLimit();
  if (!api()) $("#stxt").textContent = tx("connecting…");
}
function rerenderAll() {
  applyStatic(); CAR.sig = ""; render(); refreshStatus();
  if ($("#modal").classList.contains("open") && SHEET) openSong(SHEET);
  if ($("#gmodal").classList.contains("open") && GM) gmRender();
  if ($("#lmodal").classList.contains("open")) lsRender();
  if ($("#gearmodal").classList.contains("open")) gearRender();
  if ($("#amodal").classList.contains("open")) aiRender();
}
// language picklist: a button showing the current language + a list with flags (no native <select>: it cannot show icons)
// language: three inline radio items inside the settings menu (no second dropdown)
function renderLang() {
  $("#langhead").textContent = tx("Language");
  $("#langmenu").innerHTML = LANGS.map(l => `<button class="mi${l.code === LANG ? " on" : ""}" role="menuitemradio" aria-checked="${l.code === LANG}" data-lang="${l.code}"><span class="fl" aria-hidden="true">${l.flag}</span><span>${l.name}</span><b class="mchk" aria-hidden="true">${l.code === LANG ? "✓" : ""}</b></button>`).join("");
}
function setLang(code) {
  menuToggle(false, false); $("#mbtn").focus();
  if (code === LANG) return;
  LANG = code; store(null, ["lang", JSON.stringify(LANG)]);
  const a = api(); if (a && a.set_lang) a.set_lang(LANG);
  rerenderAll();
}
$("#langmenu").addEventListener("click", e => { const o = e.target.closest("[data-lang]"); if (o) setLang(o.dataset.lang); });
$(".logo").addEventListener("click", () => { if (RES || q) { RES = null; q = ""; $("#q").value = ""; render(); } window.scrollTo({ top: 0, behavior: "smooth" }); });

async function init() {
  const a = api();
  try { const sv = a && a.get_lang ? await a.get_lang() : null; if (sv) LANG = sv; } catch (e) {}
  try { if (a && a.get_ai) AI = await a.get_ai(); } catch (e) {}
  try { if (a && a.get_search_limit) SLIM = await a.get_search_limit(); } catch (e) {}
  applyStatic();
  SONGS = a ? await a.songs() : [];
  GUITARS = a ? await a.guitars() : [];
  try { if (a && a.get_gear) GEAR = await a.get_gear(); } catch (e) {}
  loadTabCfg();
  FAVS = a ? await a.favorites() : [];
  if (a) RECENT = await a.recent();
  if (a) META = await a.song_meta();
  render(); refreshStatus(); setInterval(refreshStatus, 5000);
  loadCovers();
}
applyStatic();
// ---- opening splash + sound: starts together once the app bridge is ready, so the motion lands on TO, NEN and AI
const SPLASH = { started: false, done: false, audio: null, t: null };
function splashGo() {
  const el = document.getElementById("splash"); if (!el || SPLASH.started) return; SPLASH.started = true;
  const a = api();
  $("#sp-tag").textContent = tx("Tone for every song");
  if (a && a.get_lang) Promise.resolve(a.get_lang()).then(l => { if (l && LANGS.some(x => x.code === l)) { LANG = l; $("#sp-tag").textContent = tx("Tone for every song"); } }).catch(() => {});
  el.classList.add("go");
  Promise.resolve(a && a.play_intro ? a.play_intro() : { ok: false }).then(r => {
    if (r && r.ok) return;
    try { SPLASH.audio = new Audio("../assets/tonenai-intro.wav"); SPLASH.audio.play().catch(() => {}); } catch (e) {}   // outside the Mac app
  }).catch(() => {});
  SPLASH.t = setTimeout(() => splashEnd(false), 4550);
}
function splashEnd(skip) {
  const el = document.getElementById("splash"); if (!el || SPLASH.done) return; SPLASH.done = true; clearTimeout(SPLASH.t);
  if (!skip) return el.remove();
  const a = api(); if (a && a.stop_intro) a.stop_intro(); if (SPLASH.audio) SPLASH.audio.pause();
  el.classList.add("skip"); setTimeout(() => el.remove(), 260);
}
document.getElementById("splash").addEventListener("click", () => splashEnd(true));
document.addEventListener("keydown", e => { if (document.getElementById("splash") && !SPLASH.done) { e.preventDefault(); e.stopImmediatePropagation(); splashEnd(true); } }, true);
window.addEventListener("pywebviewready", splashGo);
setTimeout(splashGo, 1500);   // the bridge is late or missing (browser preview): run it anyway
window.addEventListener("pywebviewready", init);
</script>
</body>
</html>
