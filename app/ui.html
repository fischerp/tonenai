<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tonai</title>
<link rel="stylesheet" href="guitar-manager.css">
<link rel="stylesheet" href="livesets.css">
<style>
  :root {
    --bg: #0b0b0f; --panel: #16161d; --text: #f4f4f6; --muted: #9a9aa8; --accent: #e50914;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
  body { overflow-y: auto; overflow-x: hidden; }
  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 20px;
    padding: 14px 4vw; background: linear-gradient(#0b0b0fee, #0b0b0f99 70%, transparent); backdrop-filter: blur(6px); }
  .logo { font-weight: 800; letter-spacing: .5px; color: var(--accent); font-size: 22px; }
  .search { flex: 1; max-width: 360px; }
  .search input { width: 100%; padding: 8px 14px; border-radius: 20px; border: 1px solid #2c2c38;
    background: #14141b; color: var(--text); font-size: 14px; outline: none; }
  .search input:focus { border-color: #55556a; }
  header button.p { padding: 7px 14px; font-size: 13px; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; }
  .dot.on { background: #3ddc84; box-shadow: 0 0 8px #3ddc84; } .dot.off { background: #d9534f; }

  .hero { position: relative; margin: 0 4vw 24px; border-radius: 14px; padding: 7vh 4vw; min-height: 34vh;
    display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #0b0b0fee 15%, #0b0b0f66 60%, transparent), linear-gradient(0deg, #0b0b0f, transparent 55%); }
  .hero > * { position: relative; z-index: 1; }
  .hero .eyebrow { color: #ffffffb0; text-transform: uppercase; letter-spacing: 2px; font-size: 12px; }
  .hero h1 { margin: 6px 0 4px; font-size: clamp(30px, 5vw, 56px); line-height: 1.05; }
  .hero .by { color: #ffffffc8; font-size: 18px; margin-bottom: 18px; }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; }
  button.p { border: 0; border-radius: 6px; padding: 10px 20px; font-size: 15px; font-weight: 600; cursor: pointer;
    background: #ffffff22; color: var(--text); transition: background .15s, transform .1s; }
  button.p:hover { background: #ffffff40; } button.p:active { transform: scale(.97); }
  button.p.main { background: var(--text); color: #000; } button.p.main:hover { background: #fff; }
  button.p.live { outline: 2px solid var(--accent); }

  section.row { margin: 0 0 26px; }
  section.row h2 { margin: 0 4vw 10px; font-size: 18px; font-weight: 700; }
  .track { display: flex; gap: 14px; overflow-x: auto; padding: 8px 4vw 18px; scroll-snap-type: x proximity; }
  .track::-webkit-scrollbar { height: 0; }
  .card { flex: 0 0 210px; height: 290px; border-radius: var(--radius); position: relative; cursor: pointer; overflow: hidden;
    scroll-snap-align: start; transition: transform .2s, box-shadow .2s; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; }
  .card:hover { transform: scale(1.06); box-shadow: 0 12px 30px #000a; z-index: 2; }
  .card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, #000e, #0004 45%, transparent 70%); }
  .card > * { position: relative; z-index: 1; }
  .card .t { font-weight: 800; font-size: 21px; line-height: 1.1; text-shadow: 0 2px 8px #0008; }
  .card .a { color: #ffffffd0; font-size: 13px; margin-top: 4px; }
  .card .badge { position: absolute; top: 12px; left: 12px; z-index: 1; font-size: 11px; font-weight: 700; letter-spacing: 1px;
    padding: 3px 8px; border-radius: 4px; background: #000a; }
  .card.live .badge { background: var(--accent); }

  .results { margin: 4px 4vw 40px; max-width: 760px; }
  .results h2 { font-size: 18px; margin: 4px 0 12px; } .results .hint { color: var(--muted); font-size: 13px; margin-left: 8px; font-weight: 400; }
  .res { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 10px; background: #14141b; margin-bottom: 8px; }
  .res:hover { background: #1c1c26; }
  .res .art { width: 56px; height: 56px; border-radius: 6px; background: #2a2a37 center/cover; flex: none; }
  .res .m { min-width: 0; flex: 1; } .res .n { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .d { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: .5px; color: #3ddc84; margin-right: 6px; }
  .empty { margin: 8vh 4vw; max-width: 520px; }
  .empty h2 { margin: 0 0 6px; font-size: 24px; } .empty p { color: var(--muted); margin: 0 0 18px; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #ffffff55; border-top-color: #fff; border-radius: 50%;
    animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 8px; } @keyframes sp { to { transform: rotate(360deg); } }
  .sheet .foot { padding: 0 30px 26px; } .link { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0; text-decoration: underline; }
  .link:hover { color: var(--text); } .sheet .foot { display: flex; align-items: center; gap: 12px; } .foot .sp { flex: 1; }
  .link.danger { color: #ff8a85; } .confirm { color: var(--muted); font-size: 13px; } .confirm button { margin-left: 8px; padding: 5px 12px; font-size: 13px; }
  button.p.red { background: #c62828; color: #fff; } button.p.red:hover { background: #e53935; }
  .modal { position: fixed; inset: 0; background: #000c; display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal.open { display: flex; }
  .sheet { width: min(620px, 92vw); max-height: 86vh; overflow: auto; background: var(--panel); border-radius: 14px; }
  .sheet .top { padding: 34px 30px 20px; position: relative; }
  .sheet .top::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--panel), transparent 80%); }
  .sheet .top > * { position: relative; z-index: 1; }
  .sheet h3 { margin: 0; font-size: 30px; } .sheet .by { color: #ffffffc0; }
  .plist { padding: 6px 30px 28px; display: grid; gap: 10px; }
  .pitem { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 8px; background: #1f1f29; cursor: pointer; }
  .pitem:hover { background: #2a2a37; } .pitem.live { outline: 2px solid var(--accent); }
  .pitem .n { font-weight: 700; } .pitem .d { color: var(--muted); font-size: 13px; }
  .pitem .go { margin-left: auto; font-weight: 700; white-space: nowrap; }
  .bpm { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .bpm .big { font-size: 46px; font-weight: 800; line-height: 1; } .bpm .big small { font-size: 14px; color: var(--muted); font-weight: 600; margin-left: 6px; }
  .bpm button { margin-left: auto; white-space: nowrap; }
  .dials { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin: 4px 0 14px; }
  .dial text { fill: #9a9aa8; font-size: 8.5px; text-anchor: middle; } .dial .on text { fill: #fff; font-weight: 700; }
  .stylerow { display: flex; gap: 4px; margin-top: 6px; } .sty { width: 26px; height: 26px; border-radius: 6px; background: #2a2a37; color: #9a9aa8; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .sty.ok { background: #1f4d36; color: #7dffb0; } .sty.three { border: 1px dashed #6d6d80; }
  .steps { margin: 10px 0 8px; padding-left: 20px; } .steps li { margin: 6px 0; } .steps b { color: #fff; }
  .gtr { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; background: #14141b; margin-bottom: 6px; }
  .gtr.best { outline: 2px solid #3ddc84; } .gtr .m { flex: 1; min-width: 0; } .gtr .n { font-weight: 700; } .gtr .d { color: var(--muted); font-size: 13px; }
  .stars { color: #ffd75e; letter-spacing: 2px; white-space: nowrap; } .stars i { color: #444455; font-style: normal; }
  .best-tag { font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #0b0b0f; background: #3ddc84; padding: 2px 7px; border-radius: 4px; margin-left: 8px; }
  .glist { padding: 6px 30px 14px; } .gempty { color: var(--muted); padding: 6px 0 12px; } .xbtn { background: none; border: 0; color: #ff8a85; cursor: pointer; font-size: 13px; }
  .badge2 { font-size: 11px; font-weight: 800; letter-spacing: 1px; padding: 3px 9px; border-radius: 5px; margin-left: 8px; vertical-align: 1px; }
  .badge2.yes { background: #1f4d36; color: #7dffb0; } .badge2.optional { background: #5a4a1a; color: #ffd75e; } .badge2.no { background: #2a2a37; color: #9a9aa8; }
  .wh { display: flex; gap: 22px; flex-wrap: wrap; margin: 6px 0 12px; } .wh .col { min-width: 120px; }
  .wh .lbl { font-size: 11px; color: var(--muted); letter-spacing: 1px; font-weight: 700; margin-bottom: 5px; }
  .pill { display: block; padding: 3px 10px; margin-bottom: 3px; border-radius: 12px; background: #2a2a37; color: #9a9aa8; font-size: 12px; font-weight: 700; }
  .pill.on { background: #c62828; color: #fff; box-shadow: 0 0 10px #c6282888; }
  .nums { display: flex; gap: 3px; margin-bottom: 8px; flex-wrap: wrap; max-width: 250px; } .nums .pill { display: inline-block; margin: 0; padding: 4px 8px; min-width: 26px; text-align: center; }
  /* song window: facts first, details on demand */
  .sheet.wide { width: min(780px, 94vw); }
  .sg-top { position: relative; padding: 26px 30px 16px; } .sg-top::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--panel) 4%, #16161d88 55%, #16161d22); }
  .sg-top > * { position: relative; z-index: 1; } .sg-top h3 { font-size: 32px; line-height: 1.05; margin: 0; } .sg-top .by { font-size: 16px; margin-top: 2px; }
  .sg-x { position: absolute; top: 14px; right: 16px; z-index: 2; display: flex; gap: 8px; }
  .tabbtn { margin-top: 10px; padding: 7px 14px; font-size: 13.5px; background: #000a; } .tabbtn:hover { background: #000d; }
  .sg-x button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: #000a; color: #fff; font-size: 17px; cursor: pointer; line-height: 1; } .sg-x button:hover { background: #000d; }
  .facts { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: baseline; margin-top: 16px; }
  .fact .v { font-size: 26px; font-weight: 800; line-height: 1; } .fact .v small { font-size: 12px; color: var(--muted); font-weight: 700; margin-left: 4px; } .fact .l { font-size: 11px; letter-spacing: 1px; color: #ffffffa8; font-weight: 700; margin-top: 3px; }
  .sg-h { margin: 6px 30px 10px; font-size: 12px; letter-spacing: 1.2px; color: var(--muted); font-weight: 800; text-transform: uppercase; }
  .patches { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; padding: 0 30px 18px; }
  .patch { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; background: #22222f; cursor: pointer; border: 1.5px solid transparent; transition: background .12s, transform .1s; }
  .patch:hover { background: #2c2c3d; } .patch:active { transform: scale(.985); } .patch.live { border-color: var(--accent); background: #2a1c22; }
  .patch .pi { width: 38px; height: 38px; border-radius: 50%; background: #e50914; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none; }
  .patch.live .pi { background: #3ddc84; color: #04120a; } .patch .n { font-weight: 800; font-size: 15px; } .patch .d { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
  .patch .tag { margin-left: auto; font-size: 11px; font-weight: 800; letter-spacing: .8px; color: #3ddc84; white-space: nowrap; }
  .tiles3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 30px 14px; } @media (max-width: 640px) { .tiles3 { grid-template-columns: 1fr; } }
  .stile { text-align: left; border: 1.5px solid #2a2a3a; background: #1b1b25; border-radius: 12px; padding: 12px 14px; cursor: pointer; color: var(--text); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .stile:hover { border-color: #4a4a62; } .stile[aria-expanded="true"] { border-color: #7a7af0; background: #1d1d34; }
  .stile .l { font-size: 11px; letter-spacing: 1.1px; color: var(--muted); font-weight: 800; display: flex; justify-content: space-between; } .stile .l i { font-style: normal; opacity: .7; }
  .stile .v { font-size: 17px; font-weight: 800; overflow-wrap: anywhere; } .stile .sub { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .stile .star { color: #ffd75e; letter-spacing: 1px; } .stile .ok { color: #7dffb0; } .stile .warn { color: #ffd75e; }
  .stile .mini { margin-top: 6px; align-self: flex-start; font-size: 12.5px; padding: 4px 10px; }
  .panel { margin: 0 30px 16px; } .panel .band { margin: 0; }
  .band { margin: 0 30px 18px; padding: 16px 18px; border-radius: 10px; background: #1b1b25; }
  .band h4 { margin: 0 0 10px; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip { background: #2a2a37; padding: 4px 11px; border-radius: 14px; font-size: 13px; font-weight: 600; } .chip b { color: var(--muted); font-weight: 600; margin-right: 5px; }
  .band .feel { margin: 0 0 8px; } .band ol { margin: 0 0 8px; padding-left: 20px; color: #d6d6de; } .band li { margin: 2px 0; }
  .band .tip { color: var(--muted); font-size: 13px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #222230; padding: 10px 18px;
    border-radius: 8px; transition: transform .25s; z-index: 99; } .toast.show { transform: translateX(-50%); }
  .toast.err { background: #5a1f22; }
</style>
</head>
<body>
<header>
  <div class="logo">TONAI</div>
  <div class="search"><input id="q" placeholder="Search songs or artists" autocomplete="off"></div>
  <button class="p" id="lbtn" title="Plan what goes into the amp's banks">📻 Livesets</button>
  <button class="p" id="gbtn" title="Register the guitars you own">🎸 My guitars</button>
  <button class="p" id="imp" title="Load a Tone Studio .tsl file">＋ Import .tsl</button>
  <div class="status"><span class="dot" id="dot"></span><span id="stxt">connecting…</span></div>
</header>
<div id="hero"></div>
<main id="rows"></main>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="modal" id="gmodal"><div class="sheet" id="gsheet"></div></div>
<div class="modal" id="lmodal"><div class="sheet xl" id="lsheet"></div></div>
<div class="toast" id="toast"></div>

<script src="guitar-shapes.js"></script>
<script src="guitars.js"></script>
<script src="guitar-manager.js"></script>
<script src="livesets.js"></script>
<script src="tabs.js"></script>
<script>
let SONGS = [], LIVE = null;          // LIVE = {id, index}
let q = "", JOB = null, RES = null, SHEET = null, GUITARS = [];   // RES = search results view (set when the user presses Enter)
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = () => window.pywebview && window.pywebview.api;

function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function bg(s) { return s.cover ? `linear-gradient(0deg, #0006, #0002), url('${s.cover}') center/cover` : grad(s); }
function grad(s) { const h = hue(s.artist || s.title); return `linear-gradient(155deg, hsl(${h} 65% 38%), hsl(${(h + 50) % 360} 70% 18%))`; }
function store(get, set) { try { return get ? JSON.parse(localStorage.getItem(get) || "null") : localStorage.setItem(...set); } catch (e) { return null; } }
function recents() { return store("recent") || []; }
function pushRecent(id) { const r = [id, ...recents().filter(x => x !== id)].slice(0, 12); store(null, ["recent", JSON.stringify(r)]); }

function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "toast", 2600); }

function match(s) { const t = (s.title + " " + s.artist + " " + s.patches.map(p => p.name).join(" ")).toLowerCase(); return t.includes(q.toLowerCase()); }

function card(s) {
  const live = LIVE && LIVE.id === s.id;
  return `<div class="card${live ? " live" : ""}" data-id="${esc(s.id)}" style="background:${bg(s)}">
    <span class="badge">${live ? "PLAYING" : s.patches.length + (s.patches.length > 1 ? " PATCHES" : " PATCH")}</span>
    <div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}</div></div>`;
}
function row(title, list) { return list.length ? `<section class="row"><h2>${esc(title)}</h2><div class="track">${list.map(card).join("")}</div></section>` : ""; }

function resultsView() {
  if (RES.loading) return `<div class="results"><h2><span class="spin"></span>Searching “${esc(RES.q)}”…</h2></div>`;
  if (RES.error) return `<div class="empty"><h2>Search failed</h2><p>${esc(RES.error)}</p></div>`;
  if (!RES.items.length) return createCta();
  return `<div class="results"><h2>Top ${RES.items.length} for “${esc(RES.q)}”<span class="hint">Esc to go back</span></h2>${RES.items.map((r, i) => `
    <div class="res"><div class="art" style="background-image:url('${esc(r.art || (SONGS.find(s => s.id === r.id) || {}).cover || "")}')"></div>
      <div class="m"><div class="n">${esc(r.title)}</div><div class="d">${r.inLibrary ? '<span class="tag">IN YOUR LIBRARY</span>' : ""}${esc(r.artist)}${r.album ? " · " + esc(r.album) : ""}</div></div>
      ${r.inLibrary ? `<button class="p main" data-open="${esc(r.id)}">Open</button>` : `<button class="p main" data-make="${i}">✦ Create</button>`}</div>`).join("")}</div>`;
}

function render() {
  const list = SONGS.filter(match);
  if (RES) { $("#hero").innerHTML = ""; $("#rows").innerHTML = JOB && JOB.state === "running" ? createCta() : resultsView(); return; }
  const liveSong = LIVE && SONGS.find(s => s.id === LIVE.id);
  const heroSong = liveSong || SONGS[0];
  $("#hero").innerHTML = heroSong && !q ? `<div class="hero" style="background:${bg(heroSong)}">
      <div class="eyebrow">${liveSong ? "Now playing on your Katana" : "Pick a song to start"}</div>
      <h1>${esc(heroSong.title)}</h1><div class="by">${esc(heroSong.artist)}</div>
      <div class="btns">${heroSong.patches.map(p => `<button class="p ${LIVE && LIVE.id === heroSong.id && LIVE.index === p.index ? "main live" : "main"}" data-play="${esc(heroSong.id)}" data-i="${p.index}">▶ ${esc(p.name)}</button>`).join("")}</div></div>` : "";
  let html = "";
  if (!q) {
    const rec = recents().map(id => SONGS.find(s => s.id === id)).filter(Boolean);
    html += row("Continue playing", rec);
    html += row("All songs", list);
    const by = {};
    list.forEach(s => (by[s.artist || "Other"] = by[s.artist || "Other"] || []).push(s));
    Object.keys(by).sort().forEach(a => { if (by[a].length > 1) html += row(a, by[a]); });
  } else html += row(`Results for “${q}”`, list);
  $("#rows").innerHTML = html || createCta();
}

function createCta() {
  const term = RES ? RES.q : q;
  if (JOB && JOB.state === "running") return `<div class="empty"><h2>Creating “${esc(JOB.query || term)}”</h2><p><span class="spin"></span>${esc(JOB.note || "Working…")}</p></div>`;
  const msg = JOB && JOB.state === "error" ? `<p style="color:#ff8a85">${esc(JOB.error)}</p>` : "";
  return term ? `<div class="empty"><h2>No match for “${esc(term)}”</h2><p>Claude can research the tone and build a patch set for this song. It takes about a minute.</p>${msg}
    <button class="p main" data-create="1">✦ Create with Claude</button></div>`
    : `<div class="empty"><h2>No songs yet</h2><p>Search for a song to have Claude create one.</p></div>`;
}

const TRIO_GENRES = ["Blues", "R&B", "Rock", "Alt Rock", "Metal", "Pop", "E-Pop", "Hip-Hop", "Country", "Folk", "Latin", "Jazz"];
function genreIndex(g) {
  const t = (g || "").toLowerCase();
  const map = [["alt", 3], ["electronic", 6], ["e-pop", 6], ["hip", 7], ["r&b", 1], ["metal", 4], ["blues", 0], ["rock", 2], ["pop", 5], ["country", 8], ["folk", 9], ["latin", 10], ["jazz", 11]];
  for (const [k, i] of map) if (t.includes(k)) return i;
  return -1;
}
function genreDial(sel) {   // 12 positions, same layout as the pedal's GENRE knob (Blues bottom-left, clockwise to Jazz bottom-right)
  const cx = 84, cy = 84, R = 62; let out = "";
  TRIO_GENRES.forEach((g, i) => {
    const a = (-150 + i * (300 / 11)) * Math.PI / 180, x = cx + R * Math.sin(a), y = cy - R * Math.cos(a), on = i === sel;
    out += `<g class="${on ? "on" : ""}"><circle cx="${x}" cy="${y}" r="${on ? 6 : 3.5}" fill="${on ? "#3ddc84" : "#555566"}"/>` +
      `<text x="${cx + (R + 21) * Math.sin(a)}" y="${cy - (R + 21) * Math.cos(a) + 3}">${esc(g)}</text></g>`;
  });
  const a = sel >= 0 ? (-150 + sel * (300 / 11)) * Math.PI / 180 : null;

function modelMatch(g, originals) {
  const mine = (g.kind + " " + g.name).toLowerCase();
  return (originals || []).some(o => { const t = (o.guitar || "").toLowerCase();
    return MODELS.some(m => (m.length > 3 ? mine.includes(m) && t.includes(m) : new RegExp("\\b" + m + "\\b").test(mine) && new RegExp("\\b" + m + "\\b").test(t))); });

function rate(g, gi) {   // -> {stars 0-3, score (for sorting), why, exact}

  if (pk === "acoustic") return { stars: 0, score: 0, why: "Acoustic: it won't suit this electric patch." };
  const exact = modelMatch(g, gi.originals);

    const mine = (g.brand + " " + g.name).toLowerCase(), sameBrand = (gi.originals || []).some(o => g.brand && (o.guitar || "").toLowerCase().includes(g.brand.toLowerCase()));
    return { stars: 3, score: 4 + (sameBrand ? .3 : 0) + (pk === need ? .1 : 0), exact: true, why: "The same model as on the record." };
  }
  if (need === "any") return { stars: pk === "hss" || pk === "hsh" ? 3 : 2, score: pk === "hss" || pk === "hsh" ? 2.6 : 2, why: "Pickup type isn't critical for this song." };
  if (pk === need) return { stars: 3, score: 3, why: `${PK[pk]} pickups, like the original.` };
  if (pk === "hss" || pk === "hsh") return { stars: 3, score: 2.8, why: need === "humbucker" ? "Use a humbucker position (bridge)." : "Use the single-coil positions (middle/neck)." };

  return need === "humbucker"
    ? { stars: 1, score: 1, why: "Thinner than the record: use the bridge pickup, raise the Katana gain a little and trim treble." }
    : { stars: 1, score: 1, why: "Hotter and thicker than the record: use the neck pickup, roll volume to ~7, split the coils if you can." };
}

  if (r.cancelled) return;
  if (!r.ok) return toast(r.error, true);
  SONGS = await a.songs(); q = ""; RES = null; $("#q").value = ""; render(); openSong(r.id); toast("Imported into your library"); loadCovers();
});
$("#q").addEventListener("input", e => { q = e.target.value.trim(); RES = null; render(); });
$("#q").addEventListener("keydown", async e => {
  if (e.key !== "Enter" || !q) return;
  const a = api(); if (!a) return;
  const term = q; RES = { q: term, loading: true }; render();
  const r = await a.search_songs(term);
  if (!RES || RES.q !== term) return;           // user typed something else meanwhile
  RES = r.ok ? { q: term, items: r.items } : { q: term, error: r.error }; render();
});

async function loadCovers() {   // fetch missing album art one by one, refreshing as each arrives
  const a = api(); if (!a) return;
  for (const s of SONGS.filter(x => !x.cover)) {   // cached ones return instantly; others are downloaded
    const r = await a.cover(s.id);
    if (r.cover) { const t = SONGS.find(x => x.id === s.id); if (t) { t.cover = r.cover; render(); } }
  }
}

async function init() {
  const a = api();
  SONGS = a ? await a.songs() : [];
  GUITARS = a ? await a.guitars() : [];
  loadTabCfg();
  render(); refreshStatus(); setInterval(refreshStatus, 5000);
  loadCovers();
}
window.addEventListener("pywebviewready", init);
</script>
</body>
