<!doctype html><meta charset="utf-8"><title>Tonai preview</title>
<!-- Dev-only: renders ui.html in a normal browser with a mock amp, so the UI can be iterated without hardware. -->
<script>
const IDS = ["rhcp-under-the-bridge","thin-lizzy-whiskey-in-the-jar","acdc-back-in-black","gnr-welcome-to-the-jungle","nirvana-smells-like-teen-spirit","pearl-jam-animal","rhcp-snow-hey-oh"];
const MOCK = `<script>
let cur="Jungle Rhythm";
window.pywebview={api:{
  songs: async()=>{const out=[];for(const id of ${JSON.stringify(IDS)}){let s=await (await fetch("../songs/"+id+".json",{cache:"no-store"})).json();s=Array.isArray(s)?s:[s];
    const head=(s[0].memo||"").split(":")[0].split(" - ");
    out.push({id,artist:head[0],title:head[1],band:s[0].band||null,whammy:s[0].whammy||null,guitar:s[0].guitar||null,cover:"../songs/covers/"+id+".jpg",patches:s.map((p,i)=>({index:i,name:p.name,amp:p.amp.type,note:(p.memo||"").split(":").slice(1).join(":").trim()}))});}return out;},
  import_tsl: async()=>({ok:false,cancelled:true}),
  cover: async(id)=>({cover:"../songs/covers/"+id+".jpg"}),
  search_songs: async(t)=>({ok:true,items:[
    {inLibrary:true,id:"acdc-back-in-black",artist:"AC/DC",title:"Back in Black",album:"",art:"",patches:2},
    {inLibrary:false,artist:"AC/DC",title:"Highway to Hell",album:"Highway to Hell",art:"../songs/covers/acdc-back-in-black.jpg"},
    {inLibrary:false,artist:"AC/DC",title:"Thunderstruck",album:"The Razors Edge",art:""},
    {inLibrary:false,artist:"AC/DC",title:"You Shook Me All Night Long",album:"Back in Black",art:""},
    {inLibrary:false,artist:"AC/DC",title:"TNT",album:"High Voltage",art:""}]}),
  delete_song: async()=>({ok:true}),
  livesets: async()=>JSON.parse(localStorage.getItem("ls")||"[]"),
  liveset_save: async(l)=>{const a=JSON.parse(localStorage.getItem("ls")||"[]"); l.id=l.id||("ls"+Date.now()); const i=a.findIndex(x=>x.id===l.id); if(i>=0)a[i]=l; else a.push(l); localStorage.setItem("ls",JSON.stringify(a)); return{ok:true,livesets:a,id:l.id};},
  liveset_delete: async(id)=>{const a=JSON.parse(localStorage.getItem("ls")||"[]").filter(x=>x.id!==id); localStorage.setItem("ls",JSON.stringify(a)); return{ok:true,livesets:a};},
  amp_slots: async()=>({ok:true,slots:["PANEL","A1","A2","A3","A4","B1","B2","B3","B4"].map((k,i)=>({index:i,key:k,label:k,name:i==0?"INIT TONE SETTING":(i==1?"Jungle Rhythm":(i==5?"Some Old Patch":"INIT TONE SETTING"))}))}),
  liveset_send: async()=>({ok:true,written:3,backup:true}),
  liveset_export: async()=>({ok:true,count:3}),
  generate_band: async()=>({ok:true}), generate_guitar: async()=>({ok:true}),
  guitars: async()=>JSON.parse(localStorage.getItem("g")||"[]"),
  save_guitar: async(g)=>{const l=JSON.parse(localStorage.getItem("g")||"[]");g.id=g.id||g.name.toLowerCase().replace(/[^a-z0-9]+/g,"-");const i=l.findIndex(x=>x.id===g.id);if(i>=0)l[i]=g;else l.push(g);localStorage.setItem("g",JSON.stringify(l));return{ok:true,guitars:l};},
  delete_guitar: async(id)=>{const l=JSON.parse(localStorage.getItem("g")||"[]").filter(x=>x.id!==id);localStorage.setItem("g",JSON.stringify(l));return{ok:true,guitars:l};},
  generate_whammy: async()=>({ok:true}),
  reveal: async()=>({ok:true}),
  create_song: async(t)=>{window._j={state:"running",note:"Researching the tone…",t:Date.now()};return{ok:true};},
  job_status: async()=>{const e=Date.now()-window._j.t;if(e>5000)return{state:"done",id:"pearl-jam-animal"};return{state:"running",note:e>2500?"Writing the patch…":"Researching the tone…"};},
  status: async()=>({connected:true,patch:cur}),
  play: async(id,i)=>{const s=await (await fetch("../songs/"+id+".json",{cache:"no-store"})).json();cur=(Array.isArray(s)?s:[s])[i].name;return{ok:true,patch:cur};}
}};
addEventListener("load",()=>dispatchEvent(new Event("pywebviewready")));
<\/script>`;
fetch("ui.html").then(r=>r.text()).then(t=>{document.open();document.write(t.replace("<script>",MOCK+"<script>"));document.close();});
</script>
