<!doctype html><meta charset="utf-8"><title>TonenAI preview</title>
<!-- Dev-only: renders ui.html in a normal browser with a mock amp, so the UI can be iterated without hardware. -->
<script>
const IDS = ["rhcp-under-the-bridge", "audioslave-like-a-stone", "gnr-welcome-to-the-jungle", "nirvana-smells-like-teen-spirit", "pearl-jam-animal", "pink-floyd-wish-you-were-here", "van-halen-jump", "the-cranberries-zombie"];
const MOCK = `<script>
let cur="Jungle Rhythm";
const MOCKPROF={summary:"A delay pedal with up to 600 ms of repeats. Set Time and Feedback first, then blend with Mix.",controls:[{name:"Time",type:"knob",range:"20-600 ms"},{name:"Feedback",type:"knob",range:"0-10"},{name:"Mix",type:"knob",range:"0-10"},{name:"Mode",type:"mode",options:["Digital","Analog","Tape"]}],midi:"no",setup:["Put it in the amp's effects loop.","Set Mix to 10 o'clock and tap the tempo."],watch:"High Feedback can self-oscillate; start low.",confidence:"likely"};
function mockRes(id){const r=(window._res||{})[id]; if(!r) return {profile:null,research:{state:"none"}}; if(r.profile) return {profile:r.profile,research:{state:"done"}}; if(Date.now()-r.t<4000) return {profile:null,research:{state:"running"}}; return {profile:MOCKPROF,research:{state:"done"}};}

window.pywebview={api:{
  songs: async()=>{const out=[];for(const id of ${JSON.stringify(IDS)}){let s=await (await fetch("../songs/"+id+".json",{cache:"no-store"})).json();s=Array.isArray(s)?s:[s];
    const head=(s[0].memo||"").split(":")[0].split(" - ");
    out.push({id,artist:head[0],title:head[1],band:s[0].band||null,whammy:s[0].whammy||null,guitar:s[0].guitar||null,cover:"../songs/covers/"+id+".jpg",patches:s.map((p,i)=>({index:i,name:p.name,amp:p.amp.type,note:(p.memo||"").split(":").slice(1).join(":").trim()}))});}return out;},
  import_tsl: async()=>({ok:false,cancelled:true}),
  cover: async(id)=>({cover:"../songs/covers/"+id+".jpg"}),
  search_songs: async(t)=>({ok:true,items:[
    {inLibrary:true,id:"acdc-back-in-black",artist:"AC/DC",title:"Back in Black",album:"",art:"",patches:2},
    {inLibrary:false,artist:"AC/DC",title:"Highway to Hell",album:"Highway to Hell",art:"../songs/covers/acdc-back-in-black.jpg"},
    {inLibrary:false,artist:"AC/DC",title:"Thunderstruck",album:"The Razors Edge",art:""},
    {inLibrary:false,artist:"AC/DC",title:"You Shook Me All Night Long",album:"Back in Black",art:""},
    {inLibrary:false,artist:"AC/DC",title:"TNT",album:"High Voltage",art:""}]}),
  get_lang: async()=>localStorage.getItem("lang")||"en", set_lang: async(l)=>{localStorage.setItem("lang",l);return{ok:true};},
  play_intro: async()=>({ok:true}), stop_intro: async()=>({ok:true}),
  song_meta: async()=>JSON.parse(localStorage.getItem("sm")||'{"rhcp-under-the-bridge":{"status":"played"},"pink-floyd-wish-you-were-here":{"status":"learning"},"audioslave-like-a-stone":{"status":"learning"}}'),
  set_song_meta: async(id,d)=>{const m=JSON.parse(localStorage.getItem("sm")||"{}");m[id]=Object.assign(m[id]||{},d);localStorage.setItem("sm",JSON.stringify(m));return{ok:true,meta:m};},
  research_pedal: async(id)=>{(window._res=window._res||{})[id]={t:Date.now()};return{ok:true};},
  save_pedal_profile: async(id,pr)=>{(window._res=window._res||{})[id]={t:0,profile:{...pr,reviewed:true}};const g=await window.pywebview.api.get_gear();return{ok:true,...g};},
  get_gear: async()=>{const cat={amps:[{id:"katana-mkii",name:"BOSS Katana MkII",tested:true,about:"The amp TonenAI is built and tested on."},{id:"katana-other",name:"Another BOSS Katana model",tested:false,about:"Not tested. Parameters may differ, so check a patch by ear before trusting it."}],
      pedals:[{id:"whammy-dt",name:"DigiTech Whammy DT",short:"WHAMMY DT",icon:"〰",kind:"whammy",default:true,about:"Pitch shifter: works out the tuning and the octave or harmony effect a song needs."},{id:"trio-plus",name:"DigiTech Trio+",short:"TRIO+",icon:"🥁",kind:"trio",default:true,about:"Band creator: works out genre, tempo and parts so it can play bass and drums along with you."}]};
    const raw=JSON.parse(localStorage.getItem("rig")||"{}"); const custom=(raw.custom||[]).map(c=>({id:c.id||("custom-"+c.name.toLowerCase().replace(/[^a-z0-9]+/g,"-")),name:c.name,short:c.name.toUpperCase().slice(0,14),icon:"🎛",kind:"generic",custom:true,about:c.about||"",...mockRes(c.id||("custom-"+c.name.toLowerCase().replace(/[^a-z0-9]+/g,"-")))}));
    const ids=new Set([...cat.pedals,...custom].map(p=>p.id)); const pedals=Array.isArray(raw.pedals)?raw.pedals.filter(i=>ids.has(i)):["whammy-dt","trio-plus"];
    return {amps:cat.amps,pedals:[...cat.pedals,...custom],rig:{amp:cat.amps.some(a=>a.id===raw.amp)?raw.amp:"katana-mkii",pedals}};},
  set_gear: async(d)=>{window._res=window._res||{};for(const c of (d.custom||[])){const id=c.id||("custom-"+c.name.toLowerCase().replace(/[^a-z0-9]+/g,"-"));if(!window._res[id])window._res[id]={t:Date.now()};}localStorage.setItem("rig",JSON.stringify({amp:d.amp,pedals:d.pedals,custom:d.custom||[]}));return {ok:true,...(await window.pywebview.api.get_gear())};},
  generate_section: async(id,kind)=>{window._j={state:"running",t:Date.now()};window._gen=[id,kind];return{ok:true};},
  recent: async()=>["pearl-jam-animal","van-halen-jump","rhcp-under-the-bridge"],
  delete_song: async()=>({ok:true}),
  favorites: async()=>JSON.parse(localStorage.getItem('fav')||'[]'),
  set_favorite: async(id,on)=>{let f=JSON.parse(localStorage.getItem('fav')||'[]').filter(x=>x!==id); if(on) f.unshift(id); localStorage.setItem('fav',JSON.stringify(f)); return {ok:true,favorites:f};},
  tabs_config: async()=>JSON.parse(localStorage.getItem('tabs')||'{"service":"","template":"","links":{}}'),
  save_tabs_config: async(c)=>{const cur=JSON.parse(localStorage.getItem('tabs')||'{"service":"","template":"","links":{}}'); Object.assign(cur,c); localStorage.setItem('tabs',JSON.stringify(cur)); window._lastTabCfg=cur; return {ok:true,config:cur};},
  open_url: async(u)=>{window._opened=u; return {ok:true};},
  livesets: async()=>JSON.parse(localStorage.getItem("ls")||"[]"),
  liveset_save: async(l)=>{const a=JSON.parse(localStorage.getItem("ls")||"[]"); l.id=l.id||("ls"+Date.now()); const i=a.findIndex(x=>x.id===l.id); if(i>=0)a[i]=l; else a.push(l); localStorage.setItem("ls",JSON.stringify(a)); return{ok:true,livesets:a,id:l.id};},
  liveset_delete: async(id)=>{const a=JSON.parse(localStorage.getItem("ls")||"[]").filter(x=>x.id!==id); localStorage.setItem("ls",JSON.stringify(a)); return{ok:true,livesets:a};},
  amp_slots: async()=>({ok:true,slots:["PANEL","A1","A2","A3","A4","B1","B2","B3","B4"].map((k,i)=>({index:i,key:k,label:k,name:i==0?"INIT TONE SETTING":(i==1?"Jungle Rhythm":(i==5?"Some Old Patch":"INIT TONE SETTING"))}))}),
  liveset_send: async()=>({ok:true,written:3,backup:true}),
  liveset_export: async()=>({ok:true,count:3}),
  generate_band: async()=>({ok:true}), generate_guitar: async()=>({ok:true}),
  guitars: async()=>JSON.parse(localStorage.getItem("g")||"[]"),
  save_guitar: async(g)=>{const l=JSON.parse(localStorage.getItem("g")||"[]");g.id=g.id||g.name.toLowerCase().replace(/[^a-z0-9]+/g,"-");const i=l.findIndex(x=>x.id===g.id);if(i>=0)l[i]=g;else l.push(g);localStorage.setItem("g",JSON.stringify(l));return{ok:true,guitars:l};},
  delete_guitar: async(id)=>{const l=JSON.parse(localStorage.getItem("g")||"[]").filter(x=>x.id!==id);localStorage.setItem("g",JSON.stringify(l));return{ok:true,guitars:l};},
  generate_whammy: async()=>({ok:true}),
  get_search_limit: async()=>Number(localStorage.getItem("sl")||10), set_search_limit: async(n)=>{localStorage.setItem("sl",n);return{ok:true,limit:n};},
  get_ai: async()=>{const o=JSON.parse(localStorage.getItem("ai")||"{}");return{provider:o.provider||"claude",env:false,presets:[{id:"ollama",name:"Ollama (this computer)",base_url:"http://localhost:11434/v1",model:"qwen2.5:14b-instruct",key:false},{id:"openai",name:"OpenAI",base_url:"https://api.openai.com/v1",model:"",key:true},{id:"custom",name:"Custom server",base_url:"",model:"",key:false}],openai:Object.assign({preset:"ollama",base_url:"http://localhost:11434/v1",model:"qwen2.5:14b-instruct",search:"duckduckgo",has_key:false},o.openai||{})};},
  set_ai: async(d)=>{localStorage.setItem("ai",JSON.stringify({provider:d.provider,openai:d}));return{ok:true,ai:await window.pywebview.api.get_ai()};},
  test_ai: async()=>({ok:true,models:["qwen2.5:14b-instruct","qwen3:8b"]}),
  reveal: async()=>({ok:true}),
  create_song: async(t)=>{window._j={state:"running",note:"Researching the tone…",t:Date.now()};return{ok:true};},
  job_status: async()=>{const e=Date.now()-window._j.t;if(e>5000)return{state:"done",id:"pearl-jam-animal"};return{state:"running",note:e>2500?"Writing the patch…":"Researching the tone…"};},
  status: async()=>({connected:true,patch:cur}),
  play: async(id,i)=>{const s=await (await fetch("../songs/"+id+".json",{cache:"no-store"})).json();cur=(Array.isArray(s)?s:[s])[i].name;return{ok:true,patch:cur};}
}};
addEventListener("load",()=>dispatchEvent(new Event("pywebviewready")));
<\/script>`;
fetch("ui.html").then(r=>r.text()).then(t=>{document.open();document.write(t.replace("<script>",MOCK+"<script>"));document.close();});
</script>
